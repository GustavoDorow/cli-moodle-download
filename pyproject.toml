[project]
name = "moodle-section-dl"
version = "0.1.0"
description = "Baixa os arquivos de uma seção de um curso Moodle da UFSC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.1",
    "questionary>=2.1",
    "requests>=2.32",
]

[project.scripts]
moodle-section-dl = "moodle_section_dl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
